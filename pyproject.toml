[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-search"
dynamic = ["version"]
description = "Local document RAG: always-on indexer and search daemons (docling, BM25 + bge-m3, reranker), a CLI, a local web dashboard, and an MCP adapter for Claude Desktop and Claude Code (other MCP hosts can use it too)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "rag-search contributors" }]
keywords = ["mcp", "rag", "search", "docling", "bge-m3", "claude"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "docling>=2.30",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "numpy>=1.26",
  "huggingface_hub>=0.24",
  # the MCP adapter (Claude Desktop, Claude Code and other MCP hosts)
  "mcp>=1.12,<2",
  # pillow-heif lets the document reader read iPhone photos (.heic)
  "pillow-heif>=0.18",
  # macOS: Apple Vision (ocrmac) reads scanned pages, and is the independent second reader that confirms repaired table cells
  "ocrmac>=1.0; sys_platform == 'darwin'",
  # Apple Silicon: the document reader, a vision-language model that reads scanned pages, pictures and image files
  "mlx-vlm>=0.3.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  # Intel Macs: PyTorch stopped publishing macOS x86_64 wheels after 2.2.2, which was compiled against NumPy 1.x
  # (with NumPy 2: "Failed to initialize NumPy: _ARRAY_API not found"); transformers 5 needs PyTorch >= 2.4 and would
  # disable torch entirely, so it is held at 4.x with huggingface_hub 0.x
  "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers>=4.44,<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "huggingface_hub>=0.30,<1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# These used to be optional; everything is installed by default now.  Kept so that `rag-search[mcp]` and
# `rag-search[mac-vlm]` in older instructions still install.
mcp = []
mac-vlm = []

[project.scripts]
rag-search = "rag_search.cli:main"
rag-search-mcp = "rag_search.mcp.server:main"

[dependency-groups]
# coverage: measuring the tests; reportlab and pillow-heif: only to rebuild / read the test corpus (tests/data/)
dev = ["pytest>=8", "ruff>=0.5", "coverage>=7.10", "reportlab>=4"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"rag_search.ui" = ["static/*", "static/docs/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "rag_search.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests/portable", "tests/real"]

# `coverage run -m unittest discover -s tests/portable -t .` then `coverage combine && coverage report -m`:
# patch = subprocess so the daemons and workers the tests start are counted too (docs/design/test-strategy.md)
[tool.coverage.run]
source = ["src/rag_search"]
parallel = true
patch = ["subprocess"]
