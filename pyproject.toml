[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-search-local"
dynamic = ["version"]
description = "Private, local document search: PDFs, Office files and images, with page-level citations."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahul Fiske" }]
keywords = ["rag", "search", "semantic-search", "local-first", "pdf", "ocr", "docling", "bge-m3", "mcp", "claude", "llm", "apple-silicon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "docling>=2.30",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "numpy>=1.26",
  "huggingface_hub>=0.24",
  # the MCP adapter (Claude Desktop, Claude Code and other MCP hosts)
  "mcp>=1.12,<2",
  # pillow-heif lets the document reader read iPhone photos (.heic)
  "pillow-heif>=0.18",
  # macOS: Apple Vision (ocrmac) reads scanned pages, and is the independent second reader that confirms repaired table cells
  "ocrmac>=1.0; sys_platform == 'darwin'",
  # Apple Silicon: the document reader, a vision-language model that reads scanned pages, pictures and image files
  "mlx-vlm>=0.3.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  # Intel Macs: PyTorch stopped publishing macOS x86_64 wheels after 2.2.2, which was compiled against NumPy 1.x
  # (with NumPy 2: "Failed to initialize NumPy: _ARRAY_API not found"); transformers 5 needs PyTorch >= 2.4 and would
  # disable torch entirely, so it is held at 4.x with huggingface_hub 0.x
  "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers>=4.44,<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "huggingface_hub>=0.30,<1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  # ... and two packages whose newest versions have no Intel Mac wheel (uv then builds them from source, which needs a
  # compiler and, for docling-parse, about 8 minutes): the last versions that have one.  This keeps docling on its
  # 2.7x line there.  scripts/check_wheels.py (run weekly in CI) says when this stops being true.
  "docling-parse<4.7.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# These used to be optional; everything is installed by default now.  Kept so that `rag-search[mcp]` and
# `rag-search[mac-vlm]` in older instructions still install.
mcp = []
mac-vlm = []

[project.urls]
Homepage = "https://github.com/rahul-fiske/rag-search"
Repository = "https://github.com/rahul-fiske/rag-search"
Documentation = "https://github.com/rahul-fiske/rag-search/blob/main/ARCHITECTURE.md"
Issues = "https://github.com/rahul-fiske/rag-search/issues"
Changelog = "https://github.com/rahul-fiske/rag-search/releases"

[project.scripts]
rag-search = "rag_search.cli:main"
rag-search-mcp = "rag_search.mcp.server:main"

[dependency-groups]
# coverage: measuring the tests; reportlab and pillow-heif: only to rebuild / read the test corpus (tests/data/)
dev = ["pytest>=8", "ruff>=0.5", "coverage>=7.10", "reportlab>=4"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"rag_search.ui" = ["static/*", "static/docs/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "rag_search.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests/portable", "tests/real"]

# `coverage run -m unittest discover -s tests/portable -t .` then `coverage combine && coverage report -m`:
# patch = subprocess so the daemons and workers the tests start are counted too (docs/design/test-strategy.md)
[tool.coverage.run]
source = ["src/rag_search"]
parallel = true
patch = ["subprocess"]
