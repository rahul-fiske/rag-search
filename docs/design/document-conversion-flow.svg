<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1950" width="1200" height="1950" role="img" aria-label="Proposed document conversion flow: pages are profiled and routed to docling (digital) or a document VLM (scanned pages, embedded pictures), checked by a quality gate, repaired when needed, reconciled per document and then chunked, embedded and published." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect width="1200" height="1950" fill="#ffffff"/><text x="30" y="44" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">rag-search · proposed document conversion</text><rect x="640" y="28" width="22" height="18" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="670" y="42" font-size="13" font-weight="600" fill="#334155" text-anchor="start">A · routing + docling</text><rect x="825" y="28" width="22" height="18" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="855" y="42" font-size="13" font-weight="600" fill="#334155" text-anchor="start">B · document VLM</text><rect x="1010" y="28" width="22" height="18" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1040" y="42" font-size="13" font-weight="600" fill="#334155" text-anchor="start">C · validation + repair</text><rect x="450" y="76" width="300" height="66" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="466" y="107" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Source file</text><text x="466" y="130" font-size="13" font-weight="400" fill="#334155" text-anchor="start">pdf · image · office · md / txt</text><path d="M600,142 V170 H150 V196" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><path d="M600,170 H410 V196" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><path d="M600,170 H930 V196" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><circle cx="600" cy="170" r="4.5" fill="#475569"/><rect x="60" y="200" width="180" height="64" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="76" y="231" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">md / txt</text><text x="76" y="254" font-size="13" font-weight="400" fill="#334155" text-anchor="start">already Markdown</text><rect x="310" y="200" width="200" height="64" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="326" y="231" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Office · HTML</text><text x="326" y="254" font-size="13" font-weight="400" fill="#334155" text-anchor="start">docx · pptx · xlsx · html</text><rect x="830" y="200" width="200" height="64" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="846" y="231" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">PDF · image</text><text x="846" y="254" font-size="13" font-weight="400" fill="#334155" text-anchor="start">jpg · png · tif · heic</text><path d="M930,264 V296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><rect x="700" y="300" width="460" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="714" y="314" width="23" height="22" rx="11" fill="#2563eb"/><text x="721" y="330" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">1</text><text x="747" y="331" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">Page profiler</text><rect x="1098" y="314" width="48" height="22" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="1122" y="330" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">CPU</text><text x="716" y="354" font-size="13" font-weight="400" fill="#334155" text-anchor="start">per page · no ML · milliseconds (pypdfium2, Pillow)</text><text x="716" y="373" font-size="13" font-weight="400" fill="#334155" text-anchor="start">text-layer quality · image coverage · hidden OCR layer</text><text x="716" y="392" font-size="13" font-weight="400" fill="#334155" text-anchor="start">script · rotation · photo or scan · resolution · hash</text><text x="716" y="412" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">an image or a TIFF frame is one page · cached pages are reused</text><path d="M930,420 V443" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><polygon points="930,444.0 1050.0,490 930,536.0 810.0,490" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="930" y="486" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Where does the</text><text x="930" y="504" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">text come from?</text><path d="M810,490 H410" fill="none" stroke="#475569" stroke-width="2"/><text x="625" y="480" font-size="13" font-weight="600" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">digital page · good text layer</text><circle cx="410" cy="490" r="4.5" fill="#475569"/><path d="M410,264 V596" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><path d="M930,536 V596" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="942" y="572" font-size="13" font-weight="600" fill="#475569" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">raster page · scan, photo, bad layer</text><rect x="200" y="600" width="420" height="148" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="214" y="614" width="32" height="22" rx="11" fill="#2563eb"/><text x="221" y="630" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">2a</text><text x="256" y="631" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">Docling standard</text><rect x="558" y="614" width="48" height="22" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="582" y="630" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">CPU</text><text x="216" y="654" font-size="13" font-weight="400" fill="#334155" text-anchor="start">2 parallel worker processes · CPU</text><text x="216" y="673" font-size="13" font-weight="400" fill="#334155" text-anchor="start">layout + TableFormer</text><text x="216" y="692" font-size="13" font-weight="400" fill="#334155" text-anchor="start">text read from the file itself</text><text x="216" y="711" font-size="13" font-weight="400" fill="#334155" text-anchor="start">large embedded pictures → 2c</text><text x="216" y="730" font-size="13" font-weight="400" fill="#334155" text-anchor="start">OCR only for small embedded pictures</text><rect x="710" y="600" width="450" height="148" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="724" y="614" width="32" height="22" rx="11" fill="#7c3aed"/><text x="731" y="630" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">2b</text><text x="766" y="631" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="start">Scanned pages · document VLM</text><rect x="1098" y="614" width="48" height="22" rx="11" fill="#0f172a"/><text x="1122" y="630" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GPU</text><text x="726" y="654" font-size="13" font-weight="400" fill="#334155" text-anchor="start">whole page is read · same reader process as 2c</text><text x="726" y="673" font-size="13" font-weight="400" fill="#334155" text-anchor="start">photos: fix orientation, straighten first</text><text x="726" y="692" font-size="13" font-weight="400" fill="#334155" text-anchor="start">layout regions → VLM reads each region</text><text x="726" y="711" font-size="13" font-weight="400" fill="#334155" text-anchor="start">PaddleOCR-VL · MinerU2.5 · GLM-OCR (C0 winner)</text><text x="726" y="730" font-size="13" font-weight="400" fill="#334155" text-anchor="start">no VLM installed: docling + OCR by script</text><path d="M410,748 V786" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah7c3aed)"/><text x="422" y="772" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="start">pictures &gt; ⅓ page found inside docx / pptx / pdf</text><rect x="330" y="790" width="540" height="132" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="344" y="804" width="32" height="22" rx="11" fill="#7c3aed"/><text x="351" y="820" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">2c</text><text x="386" y="821" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="start">Embedded pictures · document VLM</text><rect x="808" y="804" width="48" height="22" rx="11" fill="#0f172a"/><text x="832" y="820" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GPU</text><text x="346" y="844" font-size="13" font-weight="400" fill="#334155" text-anchor="start">the picture only (crop) is read; the page text stays with docling</text><text x="346" y="863" font-size="13" font-weight="400" fill="#334155" text-anchor="start">same reader process, model and GPU queue as 2b</text><text x="346" y="882" font-size="13" font-weight="400" fill="#334155" text-anchor="start">the text is merged back into the page it came from</text><text x="346" y="901" font-size="13" font-weight="400" fill="#334155" text-anchor="start">small pictures (logos, stamps) stay with docling OCR</text><path d="M250,748 V945 H450 V966" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><path d="M1100,748 V945 H750 V966" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><path d="M600,922 V966" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><path d="M150,264 V1790 H296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="160" y="1450" font-size="13" font-weight="600" fill="#475569" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">md / txt as is</text><g transform="translate(0,150)"><rect x="300" y="820" width="600" height="140" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><rect x="314" y="834" width="23" height="22" rx="11" fill="#d97706"/><text x="321" y="850" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">3</text><text x="347" y="851" font-size="16" font-weight="700" fill="#78350f" text-anchor="start">Page quality gate</text><rect x="838" y="834" width="48" height="22" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="862" y="850" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">CPU</text><text x="316" y="874" font-size="13" font-weight="400" fill="#334155" text-anchor="start">per page · cheapest checks first</text><text x="316" y="893" font-size="13" font-weight="400" fill="#334155" text-anchor="start">coverage (ink vs text) · garbage / wrong script · docling grade</text><text x="316" y="912" font-size="13" font-weight="400" fill="#334155" text-anchor="start">table shape: no duplicated columns · numbers and dates parse</text><text x="316" y="931" font-size="13" font-weight="400" fill="#334155" text-anchor="start">validators: running balance · column totals</text><path d="M380,960 V1326" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ah15803d)"/><text x="380" y="1010" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">PASS</text><path d="M700,960 V1036" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="700" y="1004" font-size="13" font-weight="600" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">SUSPECT cells</text><path d="M860,960 V1036" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="860" y="1004" font-size="13" font-weight="600" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">FAIL page</text><rect x="640" y="1040" width="420" height="120" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><rect x="654" y="1054" width="23" height="22" rx="11" fill="#d97706"/><text x="661" y="1070" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">4</text><text x="687" y="1071" font-size="16" font-weight="700" fill="#78350f" text-anchor="start">Repair (only if needed)</text><rect x="998" y="1054" width="48" height="22" rx="11" fill="#0f172a"/><text x="1022" y="1070" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GPU</text><text x="656" y="1094" font-size="13" font-weight="400" fill="#334155" text-anchor="start">one process · model loaded once</text><text x="656" y="1113" font-size="13" font-weight="400" fill="#334155" text-anchor="start">cell: crop + header strip → Qwen3-VL 4B / 8B</text><text x="656" y="1132" font-size="13" font-weight="400" fill="#334155" text-anchor="start">page: re-read with the other reader</text><path d="M850,1160 V1188" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><polygon points="850,1188.0 1015.0,1240 850,1292.0 685.0,1240" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="850" y="1236" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">invariant holds AND agrees</text><text x="850" y="1254" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">with a second read?</text><path d="M685,1240 H600 V1326" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ah15803d)"/><text x="642" y="1230" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">yes → PASS</text><path d="M1015,1240 H1070 V1286" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahb91c1c)"/><text x="1046" y="1230" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">no</text><rect x="950" y="1290" width="230" height="96" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="966" y="1321" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="start">Low confidence</text><text x="966" y="1344" font-size="13" font-weight="400" fill="#334155" text-anchor="start">best read kept, still indexed</text><text x="966" y="1363" font-size="13" font-weight="400" fill="#334155" text-anchor="start">listed in Needs attention</text><path d="M950,1360 H904" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahb91c1c)"/><rect x="300" y="1330" width="600" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="314" y="1344" width="23" height="22" rx="11" fill="#2563eb"/><text x="321" y="1360" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">5</text><text x="347" y="1361" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">Reconcile (per document)</text><rect x="838" y="1344" width="48" height="22" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="862" y="1360" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">CPU</text><text x="316" y="1384" font-size="13" font-weight="400" fill="#334155" text-anchor="start">page order · tables continued across pages · repeated headers</text><text x="316" y="1403" font-size="13" font-weight="400" fill="#334155" text-anchor="start">provenance: page · bbox · route · engine · model · verdict</text><path d="M600,1440 V1462 H430 V1486" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><rect x="300" y="1490" width="260" height="70" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="316" y="1521" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">DoclingDocument JSON</text><text x="316" y="1544" font-size="13" font-weight="400" fill="#334155" text-anchor="start">canonical · stored</text><path d="M560,1525 H636" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="598" y="1515" font-size="13" font-weight="600" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">rendered</text><rect x="640" y="1490" width="260" height="70" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="656" y="1521" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Markdown</text><text x="656" y="1544" font-size="13" font-weight="400" fill="#334155" text-anchor="start">&lt;!-- page N --&gt; markers</text><path d="M770,1560 V1584 H600 V1606" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><rect x="300" y="1610" width="600" height="64" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="316" y="1641" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Chunk → Embed → Merge → Publish</text><text x="316" y="1664" font-size="13" font-weight="400" fill="#334155" text-anchor="start">unchanged · a merged table cites a page range (&quot;2-3&quot;)</text><rect x="30" y="1690" width="48" height="22" rx="11" fill="#0f172a"/><text x="54" y="1706" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GPU</text><text x="86" y="1706" font-size="13" font-weight="400" fill="#475569" text-anchor="start">= runs on the Mac GPU (MLX / MPS)</text><rect x="340" y="1690" width="48" height="22" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="364" y="1706" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">CPU</text><text x="396" y="1706" font-size="13" font-weight="400" fill="#475569" text-anchor="start">= runs on CPU cores</text><text x="30" y="1740" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Hardware: 2a runs on the CPU, 2b and 2c on the GPU, side by side. 4 and Embed come after, one model at a time,</text><text x="30" y="1760" font-size="13" font-weight="400" fill="#475569" text-anchor="start">so at most one large model sits beside the always-on search daemon (rag-search peak ≈ 12–14 GB of the 36 GB).</text></g></svg>