<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Steps 2b and 2c run as one shared reader, one child process of the indexing worker on the GPU, beside the CPU docling pool; repair and embedding follow." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect width="1200" height="900" fill="#ffffff"/><text x="30" y="44" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Steps 2b and 2c inside an indexing run · processes, tools, hardware</text><rect x="40" y="76" width="320" height="84" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="56" y="107" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Indexer daemon</text><text x="56" y="130" font-size="13" font-weight="400" fill="#334155" text-anchor="start">always on · stdlib only</text><text x="56" y="149" font-size="13" font-weight="400" fill="#334155" text-anchor="start">starts, follows and cancels the run</text><rect x="840" y="76" width="320" height="84" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="856" y="107" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Search daemon</text><text x="856" y="130" font-size="13" font-weight="400" fill="#334155" text-anchor="start">always on · bge-m3 + reranker on the GPU</text><text x="856" y="149" font-size="13" font-weight="400" fill="#334155" text-anchor="start">keeps answering queries during the run</text><rect x="30" y="210" width="1140" height="430" rx="16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="50" y="238" font-size="14" font-weight="700" fill="#334155" text-anchor="start">Indexing worker · one per run · python -m rag_search.core.worker &lt;job&gt; · own process group (cancel stops all of it)</text><path d="M200,160 V206" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="210" y="188" font-size="13" font-weight="600" fill="#475569" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">spawns</text><path d="M1000,210 V164" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="1010" y="190" font-size="13" font-weight="600" fill="#475569" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">reload after publish</text><rect x="60" y="262" width="340" height="176" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="76" y="293" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">1 + 2a  docling pool</text><text x="76" y="316" font-size="13" font-weight="400" fill="#334155" text-anchor="start">2 child processes · CPU (P-cores)</text><text x="76" y="335" font-size="13" font-weight="400" fill="#334155" text-anchor="start">tools: docling, pypdfium2, ocrmac</text><text x="76" y="354" font-size="13" font-weight="400" fill="#334155" text-anchor="start">profiles every page</text><text x="76" y="373" font-size="13" font-weight="400" fill="#334155" text-anchor="start">converts the digital pages</text><text x="76" y="392" font-size="13" font-weight="400" fill="#334155" text-anchor="start">queues scanned pages (2b) + embedded pictures (2c)</text><rect x="440" y="312" width="180" height="76" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="456" y="343" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">page queue</text><text x="456" y="366" font-size="13" font-weight="400" fill="#334155" text-anchor="start">doc · page · image file</text><rect x="660" y="262" width="490" height="176" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="676" y="293" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="start">2b + 2c  VLM reader</text><text x="676" y="316" font-size="13" font-weight="400" fill="#334155" text-anchor="start">1 child process · GPU (Metal, through MLX)</text><text x="676" y="335" font-size="13" font-weight="400" fill="#334155" text-anchor="start">tools: mlx-vlm + document-VLM weights (≈ 2 GB),</text><text x="676" y="354" font-size="13" font-weight="400" fill="#334155" text-anchor="start">docling layout for regions, Pillow / pillow-heif</text><text x="676" y="373" font-size="13" font-weight="400" fill="#334155" text-anchor="start">model loaded once · reads pages and pictures as they arrive</text><text x="676" y="392" font-size="13" font-weight="400" fill="#334155" text-anchor="start">memory check before loading · freed at the end</text><path d="M400,350 H436" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><path d="M620,350 H656" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="418" y="340" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">queued</text><text x="638" y="340" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">next</text><rect x="60" y="484" width="340" height="112" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="76" y="515" font-size="16" font-weight="700" fill="#78350f" text-anchor="start">3  assemble + gate</text><text x="76" y="538" font-size="13" font-weight="400" fill="#334155" text-anchor="start">in the worker · CPU</text><text x="76" y="557" font-size="13" font-weight="400" fill="#334155" text-anchor="start">once every page of a document is read</text><text x="76" y="576" font-size="13" font-weight="400" fill="#334155" text-anchor="start">checks and validators per page</text><rect x="440" y="484" width="330" height="112" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="456" y="515" font-size="16" font-weight="700" fill="#78350f" text-anchor="start">4  repair</text><text x="456" y="538" font-size="13" font-weight="400" fill="#334155" text-anchor="start">child process · only if something failed</text><text x="456" y="557" font-size="13" font-weight="400" fill="#334155" text-anchor="start">mlx-vlm + Qwen3-VL-4B (8B opt-in)</text><text x="456" y="576" font-size="13" font-weight="400" fill="#334155" text-anchor="start">ocrmac as the independent second read</text><rect x="810" y="484" width="340" height="112" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="826" y="515" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Embed → merge → publish</text><text x="826" y="538" font-size="13" font-weight="400" fill="#334155" text-anchor="start">in the worker · GPU (MPS)</text><text x="826" y="557" font-size="13" font-weight="400" fill="#334155" text-anchor="start">bge-m3, loaded once (unchanged)</text><path d="M230,438 V480" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="240" y="462" font-size="13" font-weight="600" fill="#475569" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">digital pages</text><path d="M905,438 V458 H330 V480" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="600" y="452" font-size="13" font-weight="600" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">2b / 2c results</text><path d="M400,540 H436" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><path d="M770,540 H806" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><path d="M230,596 V618 H980 V600" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="600" y="612" font-size="13" font-weight="600" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">pages that pass go straight on</text><text x="30" y="680" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">One run over time (illustrative)</text><text x="30" y="722" font-size="13" font-weight="700" fill="#334155" text-anchor="start">CPU</text><text x="30" y="772" font-size="13" font-weight="700" fill="#334155" text-anchor="start">GPU</text><text x="30" y="822" font-size="13" font-weight="700" fill="#334155" text-anchor="start">GPU, shared</text><rect x="150" y="702" width="470" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="160" y="722.0" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="start">1 + 2a docling pool  ·  3 gate as each document completes</text><rect x="190" y="752" width="560" height="30" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="200" y="772.0" font-size="12" font-weight="600" fill="#4c1d95" text-anchor="start">2b + 2c document VLM  (starts with the first queued page)</text><rect x="760" y="752" width="120" height="30" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="770" y="772.0" font-size="12" font-weight="600" fill="#78350f" text-anchor="start">4 repair</text><rect x="890" y="752" width="260" height="30" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="900" y="772.0" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">embed (bge-m3)</text><rect x="150" y="802" width="1000" height="30" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="160" y="822.0" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">search daemon: idle until a query arrives; a query during 2b or embed waits a little for the GPU</text><path d="M150,862 H1150" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah475569)"/><text x="1110" y="880" font-size="13" font-weight="600" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">time</text></svg>