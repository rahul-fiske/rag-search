name: Reader spike

# By hand: does the CPU document reader (transformers backend, Granite-Docling) work on a real Intel Mac and on Linux, and
# how fast?  Downloads the model (about 0.5 GB).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build --wheel --out-dir dist
      - run: uv tool install --python 3.12 --no-build-package docling-parse --no-build-package cryptography dist/*.whl
        if: runner.os == 'macOS'
      - run: uv tool install --python 3.12 dist/*.whl
        if: runner.os != 'macOS'
      - run: '"$(uv tool dir)/rag-search-local/bin/python" scripts/reader_spike.py'
