name: CI

on:
  push:
    branches: [main, "rag_*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx ruff check src tests scripts --select E4,E7,E9,F

  # Tier A (tests/portable): hermetic, no models, no docling, no torch. Four packages are enough.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-14, python: "3.12"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python numpy pypdfium2 pillow "mcp>=1.12,<2"
      - run: |
          set +e
          PYTHONPATH=src .venv/bin/python -m unittest discover -s tests/portable -t . 2>&1 | tee tiera.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then   # the failure text as an annotation (readable without the log)
            grep -A14 -E "^(FAIL|ERROR):" tiera.log | head -80 | python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'); print('::error title=tier A failures::' + t)"
          fi
          exit "$rc"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --out-dir dist
      - run: uvx twine check dist/*
      - run: python3 scripts/check_release.py dist dist

  # A real Intel Mac (GitHub's macos-15-intel): the wheel must install without compiling anything heavy, and start.
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --wheel --out-dir dist
      - name: Install (no source builds of the packages that have no Intel wheel)
        run: uv tool install --python 3.12 --no-build-package docling-parse --no-build-package cryptography dist/*.whl
      - name: It starts and its packages are there
        run: |
          rag-search --version
          PY="$(uv tool dir)/rag-search-local/bin/python"
          "$PY" -c "import platform, torch, docling, sentence_transformers, mcp, ocrmac; print(platform.machine(), torch.__version__)"
          rag-search doctor
      - name: Tier B on Intel (real docling, real small models, the whole test corpus)
        run: |
          PY="$(uv tool dir)/rag-search-local/bin/python"
          set +e
          PYTHONPATH=src "$PY" -m unittest discover -s tests/real -t . 2>&1 | tee tierb.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then   # the failure text as an annotation (readable without the log)
            grep -A14 -E "^(FAIL|ERROR):" tierb.log | head -80 | python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'); print('::error title=tier B failures::' + t)"
          fi
          exit "$rc"
