name: Wheels

# Upstream releases change which packages have a wheel for which machine (docling-parse and cryptography stopped
# publishing Intel Mac wheels in 2026).  Weekly, and when the dependencies change: does every package still have one?

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    paths: ["pyproject.toml", "scripts/check_wheels.py"]

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: python3 scripts/check_wheels.py --python-version ${{ matrix.python }}
